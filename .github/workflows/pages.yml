name: Publish introduction

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/harbor-studio-draft/**"
      - "examples/harbor-studio-workspace/**"
      - "examples/campaign-studio-draft/**"
      - "examples/campaign-studio-workspace/**"
      - "examples/mira-public-draft/**"
      - "examples/mira-public-workspace/**"
      - "examples/campaign-kit-draft/**"
      - "examples/campaign-public-workspace/**"
      - "examples/pop-borough-draft/**"
      - "examples/tidekeeper-draft/**"
      - "examples/tidekeeper-handoff/**"
      - "examples/tidekeeper-production/**"
      - "skills/game-art-production/**"
      - "evals/tidekeeper-handoff/**"
      - "evals/tidekeeper-production/**"
      - "evals/tidekeeper-continuity/**"
      - "examples/game-art-studies/**"
      - "evals/director-workflow-v0.5/**"
      - "evals/public-demo/**"
      - "evals/team-production/**"
      - "references/**"
      - "scripts/**"
      - "templates/**"
      - "agents/**"
      - "SKILL.md"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage the introduction and documentation
        shell: bash
        run: |
          mkdir -p _site/examples _site/evals
          cp -R docs _site/docs
          cp docs/site-index.html _site/index.html
          cp -R examples/harbor-studio-draft _site/examples/
          cp -R examples/harbor-studio-workspace _site/examples/
          cp -R examples/campaign-studio-draft _site/examples/
          cp -R examples/campaign-studio-workspace _site/examples/
          cp -R examples/mira-public-draft _site/examples/
          cp -R examples/mira-public-workspace _site/examples/
          cp -R examples/campaign-kit-draft _site/examples/
          cp -R examples/campaign-public-workspace _site/examples/
          cp -R examples/pop-borough-draft _site/examples/
          cp -R examples/tidekeeper-draft _site/examples/
          cp -R examples/tidekeeper-handoff _site/examples/
          cp -R examples/tidekeeper-production _site/examples/
          cp -R skills _site/
          cp -R evals/tidekeeper-production _site/evals/
          cp -R evals/tidekeeper-continuity _site/evals/
          cp -R evals/tidekeeper-handoff _site/evals/
          cp -R examples/game-art-studies _site/examples/
          cp -R evals/director-workflow-v0.5 _site/evals/
          cp -R evals/public-demo _site/evals/
          cp -R evals/team-production _site/evals/
          cp -R references scripts templates _site/
          cp SKILL.md _site/
      - name: Build the current installable Skill alongside the introduction
        shell: bash
        run: |
          python scripts/package_release.py --out "$RUNNER_TEMP/art-director-pages.zip"
          mkdir -p _site/downloads
          cp "$RUNNER_TEMP/art-director-pages.zip" _site/downloads/art-director.zip
          (cd _site/downloads && sha256sum art-director.zip > art-director.zip.sha256)
          python scripts/package_release.py --skill game-art-production --out "$RUNNER_TEMP/game-art-production-pages.zip"
          cp "$RUNNER_TEMP/game-art-production-pages.zip" _site/downloads/game-art-production.zip
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

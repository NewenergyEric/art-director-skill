name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Enable image decoding checks
        run: python -m pip install Pillow
      - name: Check presentation media budgets and local links
        run: python evals/presentation/check.py
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Validate the director-led examples
        run: |
          python scripts/style_pack.py validate examples/harbor-studio-draft
          python scripts/style_pack.py validate examples/campaign-studio-draft
          python scripts/style_pack.py validate examples/tidekeeper-draft
          python scripts/style_pack.py validate examples/tidekeeper-handoff
          python scripts/style_pack.py validate examples/tidekeeper-production
      - name: Verify the portable Tidekeeper candidate and rejection cases
        run: python evals/tidekeeper-handoff/reproduce.py --out "${{ runner.temp }}/tidekeeper-check"
      - name: Verify public handoff evidence
        run: python evals/tidekeeper-handoff/check-evidence.py
      - name: Package the mother skill
        run: python scripts/package_release.py --out "${{ runner.temp }}/art-director-current.zip"
      - name: Verify continuous scenes and Compositor delivery
        run: python evals/tidekeeper-production/reproduce.py --out "${{ runner.temp }}/tidekeeper-production"
      - name: Package the optional production Skill
        run: python scripts/package_release.py --skill game-art-production --out "${{ runner.temp }}/game-art-production.zip"

  motion:
    name: Remotion compositions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the playable art study state transitions
        run: |
          node evals/tidekeeper-handoff/check-ui.mjs
          node evals/tidekeeper-production/check-scenes.mjs
          node evals/presentation/check-game-locales.mjs
      - name: Compile and list compositions
        run: npm run motion:check -- --browser-executable=/usr/bin/google-chrome --chrome-mode=chrome-for-testing
      - name: Render the spatial film with its bundled OFL font
        run: npx remotion still motion/src/index.ts DepthShowcaseZH "${{ runner.temp }}/film-proof.png" --frame=300 --public-dir=motion/public --browser-executable=/usr/bin/google-chrome --chrome-mode=chrome-for-testing
      - name: Render the canonical README preview
        run: npx remotion still motion/src/index.ts DepthPreviewEN "${{ runner.temp }}/preview-proof.png" --frame=80 --public-dir=motion/public --browser-executable=/usr/bin/google-chrome --chrome-mode=chrome-for-testing

name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Enable image decoding checks
        run: python -m pip install Pillow
      - name: Check presentation media budgets and local links
        run: python evals/presentation/check.py
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Validate the director-led examples
        run: |
          python scripts/style_pack.py validate examples/harbor-studio-draft
          python scripts/style_pack.py validate examples/campaign-studio-draft
      - name: Package the mother skill
        run: python scripts/package_release.py --out "${{ runner.temp }}/art-director-v0.5.1.zip"

  motion:
    name: Remotion compositions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compile and list compositions
        run: npm run motion:check -- --browser-executable=/usr/bin/google-chrome --chrome-mode=chrome-for-testing
      - name: Render a frame to catch runtime component errors
        run: npx remotion still motion/src/index.ts ArtDirectorZH "${{ runner.temp }}/motion-proof.png" --frame=530 --public-dir=motion/public --browser-executable=/usr/bin/google-chrome --chrome-mode=chrome-for-testing

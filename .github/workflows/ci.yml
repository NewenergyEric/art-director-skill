name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Enable image decoding checks
        run: python -m pip install Pillow
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Validate the fictional example
        run: python scripts/style_pack.py validate examples/moss-harbor-draft
      - name: Package the mother skill
        run: python scripts/package_release.py --out "${{ runner.temp }}/art-director-v0.2.0.zip"

  motion:
    name: Remotion compositions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compile and list compositions
        run: npm run motion:check -- --browser-executable=/usr/bin/google-chrome --chrome-mode=chrome-for-testing

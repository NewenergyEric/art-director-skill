<!doctype html><html lang="zh"><meta charset="utf-8"><title>潮灯 · 连续动作审查</title>
<style>body{margin:0;background:#173f43;color:#f9edcf;font:16px system-ui}header{padding:18px 24px;position:sticky;top:0;background:#173f43;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px}button,input,select{font:inherit;padding:7px}main{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}article{background:#f1eedb;color:#23494a;border-radius:12px;overflow:hidden}h2{margin:16px;font-size:20px}canvas{display:block;width:min(31vw,500px);height:auto}small{display:block;padding:12px}input{width:240px}#info{padding:16px}@media(max-width:700px){canvas{width:min(90vw,500px)}header{position:relative}}</style>
<header><b>维修 → 点灯 → 招手</b><button id="play">暂停</button><button id="restart">重播</button><label>播放 <select id="mode"><option value="sequence">按顺序</option><option value="parallel">并排对照</option></select></label><label>速度 <select id="speed"><option value="1">1×</option><option value="0.25">0.25×</option></select></label><input aria-label="动作时间" id="seek" type="range" min="0" max="11200" value="0"><span id="time"></span></header>
<main><article><h2>维修 · 锤子随手</h2><canvas id="repair" width="400" height="600"></canvas></article><article><h2>点灯 · 放壶 / 取杆 / 点火</h2><canvas id="ignition" width="500" height="600"></canvas></article><article><h2>招手 · 同一人物</h2><canvas id="beckon" width="400" height="600"></canvas></article></main>
<div id="info">同一人物母版与固定工具纹理驱动的二维局部动作。可暂停、拖动检查接头；这些采样相位不计作新增绘制帧。</div>
<script src="continuous-motion.js"></script><script>
let time=0,running=true,last=performance.now();window.reviewTime=0;window.sequenceReachedEnd=false;const ids=['repair','ignition','beckon'];
function render(t,mode=document.getElementById('mode').value){for(const id of ids){const local=mode==='parallel'?t:Math.max(0,Math.min(t-({repair:0,ignition:2800,beckon:6000}[id]),{repair:2800,ignition:3200,beckon:5200}[id]));const c=document.getElementById(id),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);TidekeeperMotion.draw(g,id,local,[0,0,c.width,c.height])}document.getElementById('seek').value=t;document.getElementById('time').textContent=(t/1000).toFixed(2)+' s';window.reviewTime=t;if(mode==='sequence'&&t>=11200)window.sequenceReachedEnd=true}
window.reviewReady=TidekeeperMotion.ready.then(()=>{render(0);requestAnimationFrame(function tick(now){const sequential=document.getElementById('mode').value==='sequence';if(running)time=(time+Math.min(100,now-last)*Number(document.getElementById('speed').value))%(sequential?12000:6000);last=now;render(Math.min(time,sequential?11200:5200));requestAnimationFrame(tick)})});
document.getElementById('play').onclick=()=>{running=!running;document.getElementById('play').textContent=running?'暂停':'播放'};document.getElementById('restart').onclick=()=>{time=0;window.sequenceReachedEnd=false};document.getElementById('mode').onchange=e=>{time=0;document.getElementById('seek').max=e.target.value==='sequence'?11200:5200};document.getElementById('seek').oninput=e=>{running=false;document.getElementById('play').textContent='播放';time=+e.target.value;render(time)};window.inspectAt=t=>{running=false;time=t;document.getElementById('mode').value='parallel';document.getElementById('seek').max=5200;render(t,'parallel');return Object.fromEntries(ids.map(id=>[id,TidekeeperMotion.pose(id,t)]))};
</script></html>

<text x="1204" y="586.36" font-family="Noto Sans SC,Segoe UI,sans-serif" font-size="22" font-weight="450" fill="#b2cbd7">原创样板 · 共同规范</text>
<polyline points="1204,620 1529,620" fill="none" stroke="#31586b" stroke-width="1"/>
<text x="1204" y="671.0" font-family="Noto Sans SC,Segoe UI,sans-serif" font-size="25" font-weight="700" fill="#92e4da">项目视觉包</text>
<text x="1204" y="705.48" font-family="Noto Sans SC,Segoe UI,sans-serif" font-size="21" font-weight="420" fill="#b2cbd7">规范 + 已评审样板</text>
<polyline points="1490,741 1490,792 91,792" fill="none" stroke="#007d86" stroke-width="2"/>
<polyline points="102,782 90,792 102,802" fill="none" stroke="#92e4da" stroke-width="2"/>
<rect x="256" y="767" width="1084" height="40" fill="#001f3f"/>
<text x="465" y="797.24" font-family="Noto Sans SC,Segoe UI,sans-serif" font-size="23" font-weight="500" fill="#92e4da">样板测试、玩家反应和实际工时，回到前面的决定中。</text>
<text x="64" y="871.48" font-family="Noto Sans SC,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#b2cbd7">个人：轮流承担四个岗位。团队：共享同一份依据。工程实现并验证这些选择。</text></svg>

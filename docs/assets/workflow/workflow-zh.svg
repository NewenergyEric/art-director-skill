<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>一起，做出值得做的游戏。</title><desc>样板测试、玩家反应和实际工时，回到前面的决定中。</desc><rect width="1600" height="900" fill="#001f3f"/>
